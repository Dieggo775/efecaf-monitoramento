# Para onde os alertas vão: Telegram.
# O TOKEN fica em alertmanager/secrets/telegram_token (fora do Git).
# Aqui você só troca o chat_id (Etapa 6 do README).

route:
  receiver: telegram
  group_by: ["alertname"]
  group_wait: 10s        # espera 10s para juntar alertas parecidos numa mensagem só
  group_interval: 30s
  repeat_interval: 1h    # se continuar disparado, repete a cada 1h

receivers:
  - name: telegram
    telegram_configs:
      - bot_token_file: /etc/alertmanager/secrets/telegram_token
        chat_id: 123456789
        send_resolved: true
        parse_mode: HTML
        message: '{{ template "telegram.efecaf" . }}'

templates:
  - /etc/alertmanager/templates/*.tmpl
